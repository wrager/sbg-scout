<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>sbg fake app</title>
</head>
<body>
    <div id="game-root">fake app page</div>
    <script>
        // i18next-заглушка: ScoutBridge.BOOTSTRAP_SCRIPT поллит каждые 100ms,
        // пока игра не загрузится (i18next готов, .loading-screen и .fatal-error
        // нет). Без заглушки игра не считается загруженной и подложка загрузки
        // не снимается. Устанавливаем сразу, до того как bootstrap стартует.
        window.i18next = { isInitialized: true };
        window.__sbgFakeReady = true;
        window.__sbgFakePage = "app";
    </script>
</body>
</html>
