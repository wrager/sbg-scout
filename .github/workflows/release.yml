name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Preserve manual release notes
        run: node scripts/releaseNotes.mjs ensure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Require signing secrets
        env:
          RELEASE_STORE: ${{ secrets.RELEASE_STORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE" || { echo '::error::RELEASE_STORE is required'; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo '::error::RELEASE_STORE_PASSWORD is required'; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo '::error::RELEASE_KEY_PASSWORD is required'; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Verify prepared release against its comment
        run: node scripts/releaseNotes.mjs publish-check "$RELEASE_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
      - name: Check release notes
        run: node scripts/checkRelease.mjs "$RELEASE_TAG"

      - name: Check latest bundled SVP before building
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/updateBundledSvp.mjs --check

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Build release APK
        env:
          RELEASE_STORE: ${{ secrets.RELEASE_STORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify release assets
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          test "$(apkanalyzer manifest version-name app/build/outputs/apk/release/app-release.apk)" = "${RELEASE_TAG#v}"
          IFS=. read -r major minor patch <<< "${RELEASE_TAG#v}"
          test "$(apkanalyzer manifest version-code app/build/outputs/apk/release/app-release.apk)" = "$((major * 10000 + minor * 100 + patch))"
          unzip -p app/build/outputs/apk/release/app-release.apk assets/scripts/sbg-vanilla-plus.user.js | cmp - app/src/main/assets/scripts/sbg-vanilla-plus.user.js
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/sbg-scout-$RELEASE_TAG.apk"

      - name: Check signing certificate against previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/checkReleaseSigning.mjs "$RELEASE_TAG" "app/build/outputs/apk/release/sbg-scout-$RELEASE_TAG.apk"

      - name: Recheck latest bundled SVP before publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/updateBundledSvp.mjs --check

      - name: Recheck manual notes before publishing
        run: node scripts/releaseNotes.mjs publish-check "$RELEASE_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
      - name: Publish GitHub Release after uploading APK
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          target_commitish: ${{ needs.release-please.outputs.sha }}
          body_path: RELEASE_NOTES.md
          files: app/build/outputs/apk/release/sbg-scout-${{ needs.release-please.outputs.tag_name }}.apk
          fail_on_unmatched_files: true
          overwrite_files: false
          draft: false
          make_latest: true
