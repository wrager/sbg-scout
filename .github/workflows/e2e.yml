name: e2e

on:
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/src/instr/**'
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  connected-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # Общий профиль Pixel 4; кешируем данные AVD, запускаем без snapshot.
          key: avd-pixel4-api33-default-x86_64-coldboot-v4

      - name: Run connectedInstrAndroidTest + visualRegressionTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          ram-size: 2048M
          heap-size: 256M
          emulator-options: >-
            -no-window -gpu swiftshader -feature -Vulkan -cores 2 -no-snapshot
            -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Отдельные Gradle invocations сохраняют полный e2e-прогон:
          # VR-фильтр применяется только ко второй команде, AVD общий.
          script: |
            ./gradlew connectedInstrAndroidTest --stacktrace --no-daemon
            ./gradlew visualRegressionTest --stacktrace --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
            app/build/reports/visual-regression/
            app/build/outputs/connected_android_test_additional_output/**/visual-regression/
          if-no-files-found: warn
          retention-days: 14
