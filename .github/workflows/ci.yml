name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Check shared agent skills
        run: node scripts/syncAgentSkills.mjs --check

      - name: Check release notes
        run: node scripts/checkRelease.mjs

      - name: Test release checks
        run: node --test scripts/checkRelease.test.mjs

      - name: Test skill synchronization
        run: node --test scripts/syncAgentSkills.test.mjs

  check:
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.preview.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Android Lint
        run: ./gradlew lintInstr

      - name: Unit tests
        run: ./gradlew testInstrUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build instrumentation APK
        run: ./gradlew assembleInstr

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload PR preview
        id: preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview-${{ github.event.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  preview-comment:
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      needs.check.outputs.preview-url != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message-id: preview-${{ github.run_id }}-${{ github.run_attempt }}
          message: |
            Тестовая сборка **SBG Scout debug** прошла проверки Android job `check`.

            [Скачать тестовую сборку (ZIP)](${{ needs.check.outputs.preview-url }})

            PR commit: `${{ github.event.pull_request.head.sha }}`
            Собрана совместно с main (merge commit): `${{ github.sha }}`
            [Запуск CI](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }})

            Для скачивания нужен вход в GitHub. Распакуйте ZIP и установите
            `app-debug.apk`. Debug устанавливается рядом со стабильной версией.
            При несовпадении сертификатов CI-сборок потребуется переустановка debug.
            Статусы e2e и других jobs смотрите отдельно. Ссылка действует 14 дней,
            если artifact или запуск CI не удалён раньше.
