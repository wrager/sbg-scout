name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check shared agent skills
        run: node scripts/syncAgentSkills.mjs --check

      - name: Test skill synchronization
        run: node --test scripts/syncAgentSkills.test.mjs

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Android Lint
        run: ./gradlew lintInstr

      - name: Unit tests
        run: ./gradlew testInstrUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build instrumentation APK
        run: ./gradlew assembleInstr

      - name: Build release APK
        run: ./gradlew assembleRelease
