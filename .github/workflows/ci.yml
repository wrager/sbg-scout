name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      android: ${{ steps.plan.outputs.android }}
      tooling: ${{ steps.plan.outputs.tooling }}
      windows: ${{ steps.plan.outputs.windows }}
      workflows: ${{ steps.plan.outputs.workflows }}
      e2e: ${{ steps.plan.outputs.e2e }}
      visual: ${{ steps.plan.outputs.visual }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Select checks from the complete diff
        id: plan
        run: node scripts/planChecks.mjs --github

  windows-tools:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse PowerShell helpers and test Android commands
        shell: powershell
        run: ./scripts/checkPowerShell.ps1

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate GitHub Actions workflows
        run: '"$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes='

  agent-skills:
    needs: changes
    # Required check: a failed/missing plan must fail, rather than become a green skip.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.tooling != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Require a valid change plan
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.tooling }}
        run: test "$PLAN_RESULT" = success && test "$SELECTED" = true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Check shared agent skills
        if: contains(fromJSON(needs.changes.outputs.checks), 'skills')
        run: node scripts/syncAgentSkills.mjs --check

      - name: Check release notes
        if: contains(fromJSON(needs.changes.outputs.checks), 'release-files')
        run: node scripts/checkRelease.mjs

      - name: Test release checks
        if: contains(fromJSON(needs.changes.outputs.checks), 'release-tests')
        run: node --test scripts/checkRelease.test.mjs

      - name: Test APK signing checks
        run: node --test scripts/checkReleaseSigning.test.mjs

      - name: Test bundled SVP updates
        if: contains(fromJSON(needs.changes.outputs.checks), 'svp-tests')
        run: node --test scripts/updateBundledSvp.test.mjs

      - name: Check latest bundled SVP in release PR
        if: contains(fromJSON(needs.changes.outputs.checks), 'latest-svp')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/updateBundledSvp.mjs --check

      - name: Test skill synchronization
        if: contains(fromJSON(needs.changes.outputs.checks), 'skills-tests')
        run: node --test scripts/syncAgentSkills.test.mjs

      - name: Test check selection
        if: contains(fromJSON(needs.changes.outputs.checks), 'planner-tests')
        run: node --test scripts/planChecks.test.mjs

      - name: Check Node and JSON syntax
        if: contains(fromJSON(needs.changes.outputs.checks), 'node-syntax')
        run: node scripts/checkSyntax.mjs

  check:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.android != 'false')
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.preview.outputs.artifact-url }}
    steps:
      - name: Require a valid change plan
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.android }}
        run: test "$PLAN_RESULT" = success && test "$SELECTED" = true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Restore CI debug keystore
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          DEBUG_STORE: ${{ secrets.DEBUG_STORE }}
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user
        run: |
          test -n "$DEBUG_STORE" || { echo '::error::DEBUG_STORE is required for CI debug signing'; exit 1; }
          umask 077
          mkdir -p "$ANDROID_USER_HOME"
          printf '%s' "$DEBUG_STORE" | base64 --decode > "$ANDROID_USER_HOME/debug.keystore"
          keytool -list -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -alias androiddebugkey
          printf 'ANDROID_USER_HOME=%s\n' "$ANDROID_USER_HOME" >> "$GITHUB_ENV"

      - name: ktlint
        if: contains(fromJSON(needs.changes.outputs.checks), 'ktlint')
        run: ./gradlew ktlintCheck

      - name: detekt
        if: contains(fromJSON(needs.changes.outputs.checks), 'detekt')
        run: ./gradlew detekt

      - name: Android Lint
        if: contains(fromJSON(needs.changes.outputs.checks), 'lint')
        run: ./gradlew lintInstr

      - name: Unit tests
        if: contains(fromJSON(needs.changes.outputs.checks), 'unit')
        run: ./gradlew testInstrUnitTest

      - name: Build debug APK
        if: contains(fromJSON(needs.changes.outputs.checks), 'debug')
        run: ./gradlew assembleDebug

      - name: Build instrumentation APK
        if: contains(fromJSON(needs.changes.outputs.checks), 'instr')
        run: ./gradlew assembleInstr

      - name: Build release APK
        if: contains(fromJSON(needs.changes.outputs.checks), 'release')
        run: ./gradlew assembleRelease

      - name: Upload PR preview
        id: preview
        if: >-
          contains(fromJSON(needs.changes.outputs.checks), 'debug') &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview-${{ github.event.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.e2e == 'true' || needs.changes.outputs.visual == 'true')
    uses: ./.github/workflows/e2e.yml
    with:
      functional: ${{ needs.changes.outputs.e2e == 'true' }}
      visual: ${{ needs.changes.outputs.visual == 'true' }}

  preview-comment:
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      needs.check.outputs.preview-url != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message-id: preview-${{ github.run_id }}-${{ github.run_attempt }}
          message: |
            Тестовая сборка **SBG Scout debug** прошла выбранные Android-проверки job `check`.

            [Скачать тестовую сборку (ZIP)](${{ needs.check.outputs.preview-url }})

            PR commit: `${{ github.event.pull_request.head.sha }}`
            Собрана совместно с main (merge commit): `${{ github.sha }}`
            [Запуск CI](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }})

            Для скачивания нужен вход в GitHub. Распакуйте ZIP и установите
            `app-debug.apk`. Debug устанавливается рядом со стабильной версией.
            Все новые CI-сборки подписаны одним debug-ключом. При переходе со старой
            сборки потребуется один раз переустановить debug-приложение.
            Статусы e2e и других jobs смотрите отдельно. Ссылка действует 14 дней,
            если artifact или запуск CI не удалён раньше.
